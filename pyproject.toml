[project]
name = "tenx"
version = "0.1.0"
description = "10^x hours - a terminal logger for deliberate practice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
tenx = "tenx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenx"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
